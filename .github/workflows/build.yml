name: build

on:
  push:
    branches: ["main", "master", "work"]
  pull_request:

jobs:
  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest bottle pyyaml

      - name: Build Balance
        run: make -C tcp

      - name: Prepare Go modules
        run: go mod tidy

      - name: Prepare artifacts
        run: mkdir -p dist/bin dist/service dist/config

      - name: Build controller
        run: go build -o dist/bin/hylance-controller ./cmd/controller

      - name: Run Go tests
        run: go test ./...

      - name: Run Python tests
        run: pytest

      - name: Package native artifact
        run: |
          cp tcp/balance dist/bin/balance
          cp cmd/service/main.py dist/service/hylance-service.py
          cp docker/start-hylance.sh dist/service/start-hylance.sh
          cp example-config.yaml dist/config/example-config.yaml
          tar -czf dist/hylance-native-linux-amd64.tar.gz -C dist bin service config

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: hylance-native-linux-amd64
          path: dist/hylance-native-linux-amd64.tar.gz
          if-no-files-found: error

  docker-image:
    runs-on: ubuntu-latest
    needs: native-build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hylance:ci .

      - name: Export Docker image
        run: docker save hylance:ci | gzip > hylance-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hylance-image
          path: hylance-image.tar.gz
          if-no-files-found: error
